        function callGAS(action, data = {}) {
            return fetch(GAS_API_URL, {
                method: 'POST',
                body: JSON.stringify({ action: action, data: data }),
                headers: { 'Content-Type': 'text/plain' }
            }).then(res => res.json()).catch(err => {
                console.error("callGAS Error (" + action + "):", err);
                throw err;
            });

        const DB = {
            CACHE_KEY: 'publishinc_books_cache',

            async getBooks() {
                return new Promise((resolve) => {
                    if (typeof google !== 'undefined') {
                        google.script.run
                            .withSuccessHandler(res => {
                                if (Array.isArray(res)) {
                                    this.saveCache(res);
                                    resolve(res);
                                } else {
                                    const cached = this.getCache();
                                    resolve(cached ? cached : [...MOCK_BOOKS]);

                            })
                            .withFailureHandler(err => {

                                resolve(cached ? cached : [...MOCK_BOOKS]);

                        }).catch(err => resolve({ success: false, error: err }));
                    }
                });

                            .withFailureHandler(err => resolve([]))
                            .getMessages(token);

                            resolve(res && res.success ? res.data : []);
                        }).catch(err => resolve([]));
                    }
                });
            },

                try {
                    localStorage.setItem(this.CACHE_KEY, JSON.stringify({

                        data: data
                    }));
                } catch (e) {
                    console.error("Gagal menyimpan cache", e);
                }
            },

                try {

                    if (cached) {
                        const parsed = JSON.parse(cached);
                        console.log("Data dipulihkan dari cache (Umur:", Math.round((new Date().getTime() - parsed.timestamp) / 60000), "menit)");
                        return parsed.data;
                    }
                } catch (e) {
                    console.error("Gagal membaca cache", e);

                return []; // Fallback terakhir jika semua gagal

                const backdrop = document.createElement('div');
                backdrop.className = 'fixed inset-0 z-[200] bg-slate-900/50 flex items-center justify-center p-4 fade-in';
                backdrop.innerHTML = `
                    <div class="bg-white rounded-xl shadow-2xl w-full max-w-sm p-6 text-center transform transition-transform scale-95 duration-200">
                        <div class="mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-red-100 mb-4">

                        </div>

                `;
                document.body.appendChild(backdrop);

                setTimeout(() => {

                    backdrop.remove();

                    onConfirm();

            async init() {
                // Tampilkan loading state sederhana (opsional)
                this.rootEl.innerHTML = '<div class="flex justify-center items-center h-64 w-full"><div class="animate-pulse text-gray-500 font-medium">Memuat data katalog...</div></div>';

                // Ambil data melalui Database Manager
                const [books, about] = await Promise.all([DB.getBooks(), DB.getAbout()]);
                this.state.booksData = books;
                this.state.aboutData = about;

                // Cek status login dari sessionStorage (untuk prototipe)
                if (sessionStorage.getItem('publishinc_admin') === 'true' || sessionStorage.getItem('publishinc_admin_token')) {
                    this.state.isAdmin = true;
                    this.updateAuthUI();
                }

                // Cek Routing (dari GAS Server variables)
                if (typeof ROUTE_VIEW !== 'undefined' && ROUTE_VIEW !== '') {
                    this.state.view = ROUTE_VIEW;
                    if (ROUTE_VIEW === 'detail' && typeof ROUTE_ID !== 'undefined' && ROUTE_ID !== '') {
                        this.state.activeBookId = ROUTE_ID;
                    }
                    this.render();
                } else if (window.location.hash && window.location.hash.length > 2) {
                    this.handleHashChange();
                } else {
                    // Render view awal default
                    this.render();
                }

                // Set listener untuk perubahan URL hash
                window.addEventListener('hashchange', () => {
                    this.handleHashChange();
                });
            },

            handleHashChange() {
                const hash = window.location.hash.substring(2); // Hapus '#/'
                if (!hash) return;

                const parts = hash.split('/');
                let viewName = parts[0] || 'home';
                const param = parts[1] || null;

                // Proteksi route admin
                if (viewName === 'adminDashboard' || viewName === 'adminMessages') {
                    if (!this.state.isAdmin) viewName = 'login';
                }

                this.state.view = viewName;
                if (viewName === 'detail') {
                    this.state.activeBookId = param;
                }

                window.scrollTo({ top: 0, behavior: 'smooth' });
                this.updateNavState();
                this.render();
            },

            async navigate(viewName, param = null) {
                // Hash Routing untuk GitHub Pages
                let newHash = `#/${viewName}`;
                if (param) {
                    newHash += `/${param}`;
                }
                if (window.location.hash === newHash) {
                    this.handleHashChange();
                } else {
                    window.location.hash = newHash;
                }
            },

            updateNavState() {
                const links = document.querySelectorAll('.nav-link');
                links.forEach(link => {
                    const target = link.getAttribute('data-target');
                    if (target) {
                        if (target === this.state.view || (target === 'catalog' && this.state.view === 'detail')) {
                            link.classList.remove('text-gray-600', 'border-transparent');
                            link.classList.add('text-brand-orange', 'border-brand-orange');
                        } else {
                            link.classList.remove('text-brand-orange', 'border-brand-orange');
                            link.classList.add('text-gray-600', 'border-transparent');
                        }
                    }
                });
            },

            updateAuthUI() {
                const loginBtn = document.getElementById('admin-login-btn');
                const logoutBtn = document.getElementById('admin-logout-btn');
                const messagesBtn = document.getElementById('admin-messages-btn');

                const mobileLoginBtn = document.getElementById('mobile-admin-login-btn');
                const mobileLogoutBtn = document.getElementById('mobile-admin-logout-btn');
                const mobileMessagesBtn = document.getElementById('mobile-admin-messages-btn');

                if (this.state.isAdmin) {
                    if (loginBtn) {
                        loginBtn.textContent = 'Dashboard';
                        loginBtn.setAttribute('onclick', "app.navigate('adminDashboard')");
                    }
                    if (logoutBtn) logoutBtn.classList.remove('hidden');
                    if (messagesBtn) messagesBtn.classList.remove('hidden');

                    if (mobileLoginBtn) {
                        mobileLoginBtn.textContent = 'Dashboard';
                        mobileLoginBtn.setAttribute('onclick', "app.navigate('adminDashboard'); document.getElementById('mobile-menu').classList.add('hidden')");
                    }
                    if (mobileLogoutBtn) mobileLogoutBtn.classList.remove('hidden');
                    if (mobileMessagesBtn) mobileMessagesBtn.classList.remove('hidden');
                } else {
                    if (loginBtn) {
                        loginBtn.textContent = 'Admin Login';
                        loginBtn.setAttribute('onclick', "app.navigate('login')");
                    }
                    if (logoutBtn) logoutBtn.classList.add('hidden');
                    if (messagesBtn) messagesBtn.classList.add('hidden');

                    if (mobileLoginBtn) {
                        mobileLoginBtn.textContent = 'Admin Login';
                        mobileLoginBtn.setAttribute('onclick', "app.navigate('login'); document.getElementById('mobile-menu').classList.add('hidden')");
                    }
                    if (mobileLogoutBtn) mobileLogoutBtn.classList.add('hidden');
                    if (mobileMessagesBtn) mobileMessagesBtn.classList.add('hidden');
                }
            },

            async loadMessages() {
                if (!this.state.isAdmin) return;
                const token = sessionStorage.getItem('publishinc_admin_token');
                this.state.messages = await DB.getMessages(token);
            },

            handleLogin(e) {
                e.preventDefault();
                const user = document.getElementById('username').value;
                const pass = document.getElementById('password').value;
                const btn = document.querySelector('#login-form button[type="submit"]');
                const errDiv = document.getElementById('login-error');

                btn.textContent = 'Memverifikasi...';
                btn.disabled = true;
                errDiv.classList.add('hidden');

                if (typeof google !== 'undefined') {
                    google.script.run
                        .withSuccessHandler((res) => {
                            if (res.success) {
                                this.state.isAdmin = true;
                                sessionStorage.setItem('publishinc_admin_token', res.token);
                                this.updateAuthUI();
                                this.navigate('adminDashboard');
                            } else {
                                errDiv.textContent = res.error;
                                errDiv.classList.remove('hidden');
                                btn.textContent = 'Masuk';
                                btn.disabled = false;
                            }
                        })
                        .withFailureHandler((err) => {
                            errDiv.textContent = 'Koneksi gagal';
                            errDiv.classList.remove('hidden');
                            btn.textContent = 'Masuk';
                            btn.disabled = false;
                        })
                        .verifyAdminLogin(user, pass);
                } else {
                    callGAS('verifyAdminLogin', { username: user, password: pass }).then(res => {
                        if (res && res.success && res.data && res.data.success) {
                            this.state.isAdmin = true;
                            sessionStorage.setItem('publishinc_admin_token', res.data.token);
                            this.updateAuthUI();
                            this.navigate('adminDashboard');
                        } else {
                            errDiv.textContent = (res && res.data && res.data.error) ? res.data.error : 'Login gagal';
                            errDiv.classList.remove('hidden');
                            btn.textContent = 'Masuk';
                            btn.disabled = false;
                        }
                    }).catch(err => {
                        errDiv.textContent = 'Koneksi gagal';
                        errDiv.classList.remove('hidden');
                        btn.textContent = 'Masuk';
                        btn.disabled = false;
                    });
                }
            },

            logout() {
                this.state.isAdmin = false;
                sessionStorage.removeItem('publishinc_admin_token');
                this.updateAuthUI();
                this.navigate('home');
            },

            // --- FUNGSI ADMIN MANAJEMEN BUKU ---

            handleCategoryChange() {
                const select = document.getElementById('form-category');
                const otherInput = document.getElementById('form-category-other');
                if (select.value === 'LAINNYA') {
                    otherInput.classList.remove('hidden');
                    otherInput.required = true;
                } else {
                    otherInput.classList.add('hidden');
                    otherInput.required = false;
                    otherInput.value = '';
                }
            },

            showBookModal(id = null) {
                const modal = document.getElementById('book-modal');
                const title = document.getElementById('modal-title');
                const form = document.getElementById('book-form');

                form.reset(); // Clear form
                document.getElementById('form-category-other').classList.add('hidden');
                document.getElementById('form-category-other').required = false;

                if (id) {
                    title.textContent = 'Edit Buku';
                    const book = this.state.booksData.find(b => b.id === id);
                    if (book) {
                        document.getElementById('form-id').value = book.id;
                        document.getElementById('form-title').value = book.title;
                        document.getElementById('form-author').value = book.author;

                        const catSelect = document.getElementById('form-category');
                        const standardCats = ['NONFIKSI', 'FIKSI', 'BUKU AJAR', 'REFERENSI', 'TEKNIK', 'PENDIDIKAN'];
                        if (standardCats.includes(book.category)) {
                            catSelect.value = book.category;
                        } else {
                            catSelect.value = 'LAINNYA';
                            const otherInput = document.getElementById('form-category-other');
                            otherInput.value = book.category;
                            otherInput.classList.remove('hidden');
                            otherInput.required = true;
                        }

                        document.getElementById('form-price').value = book.price;
                        document.getElementById('form-status').value = book.status;
                        document.getElementById('form-cover').value = book.coverStyle;
                        document.getElementById('form-isbn').value = book.isbn || '';
                        document.getElementById('form-year').value = book.year || '';
                        document.getElementById('form-pages').value = book.pages || '';
                        document.getElementById('form-publisher').value = book.publisher || '';
                        document.getElementById('form-desc').value = book.description || '';
                        document.getElementById('form-featured').checked = book.isFeatured || false;
                        document.getElementById('form-new').checked = book.isNew || false;
                    }
                } else {
                    title.textContent = 'Tambah Buku Baru';
                    document.getElementById('form-id').value = '';
                }

                modal.classList.remove('hidden');
            },

            closeBookModal() {
                document.getElementById('book-modal').classList.add('hidden');
            },

            saveBook(e) {
                e.preventDefault();
                const id = document.getElementById('form-id').value;
                const btn = document.querySelector('#book-form button[type="submit"]');
                btn.textContent = 'Menyimpan...';
                btn.disabled = true;

                const bookData = {
                    title: document.getElementById('form-title').value,
                    author: document.getElementById('form-author').value,
                    category: document.getElementById('form-category').value === 'LAINNYA' ? document.getElementById('form-category-other').value : document.getElementById('form-category').value,
                    price: parseInt(document.getElementById('form-price').value),
                    status: document.getElementById('form-status').value,
                    coverStyle: document.getElementById('form-cover').value,
                    isbn: document.getElementById('form-isbn').value,
                    year: parseInt(document.getElementById('form-year').value) || new Date().getFullYear(),
                    pages: parseInt(document.getElementById('form-pages').value) || 0,
                    publisher: document.getElementById('form-publisher').value,
                    description: document.getElementById('form-desc').value,
                    isFeatured: document.getElementById('form-featured').checked,
                    isNew: document.getElementById('form-new').checked,
                    isNewBook: !id
                };

                if (id) {
                    bookData.id = id;
                } else {
                    bookData.id = 'PUB-' + new Date().getFullYear() + '-' + Math.floor(Math.random() * 1000).toString().padStart(3, '0');
                }

                const fileInput = document.getElementById('form-cover-file');

                if (fileInput && fileInput.files.length > 0) {
                    btn.textContent = 'Mengunggah Foto...';
                    const file = fileInput.files[0];
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        bookData.file = {
                            data: e.target.result.split(',')[1],
                            mimeType: file.type,
                            name: bookData.id + '_' + file.name
                        };
                        this.executeSaveBook(bookData, btn);
                    };
                    reader.readAsDataURL(file);
                } else {
                    this.executeSaveBook(bookData, btn);
                }
            },

            executeSaveBook(bookData, btn) {
                const token = sessionStorage.getItem('publishinc_admin_token');
                if (typeof google !== 'undefined') {
                    google.script.run
                        .withSuccessHandler((res) => {
                            btn.textContent = 'Simpan';
                            btn.disabled = false;
                            if (res.success) {
                                this.closeBookModal();
                                DB.getBooks().then(data => {
                                    this.state.booksData = data;
                                    this.showToast("Buku berhasil disimpan!", "success");
                                    this.render();
                                });
                            } else {
                                this.showToast("Gagal menyimpan: " + res.error, "error");
                                this.render();
                            }
                        })
                        .withFailureHandler((err) => {
                            btn.textContent = 'Simpan';
                            btn.disabled = false;
                            this.showToast("Koneksi gagal: " + err, "error");
                        })
                        .saveBookToSheet(bookData, token);
                } else {
                    callGAS('saveBook', { bookData: bookData, token: token }).then(res => {
                        btn.textContent = 'Simpan';
                        btn.disabled = false;
                        if (res && res.success && res.data && res.data.success) {
                            this.closeBookModal();
                            DB.getBooks().then(data => {
                                this.state.booksData = data;
                                this.showToast("Buku berhasil disimpan!", "success");
                                this.render();
                            });
                        } else {
                            this.showToast("Gagal menyimpan: " + ((res && res.data && res.data.error) ? res.data.error : 'Error'), "error");
                            this.render();
                        }
                    }).catch(err => {
                        btn.textContent = 'Simpan';
                        btn.disabled = false;
                        this.showToast("Koneksi gagal: " + err, "error");
                    });
                }
            },

            deleteBook(id) {
                this.showConfirm('Apakah Anda yakin ingin menghapus buku ini?', () => {
                    const token = sessionStorage.getItem('publishinc_admin_token');
                    if (typeof google !== 'undefined') {
                        google.script.run
                            .withSuccessHandler((res) => {
                                if (res.success) {
                                    this.showToast("Buku berhasil dihapus!", "success");
                                    DB.getBooks().then(data => {
                                        this.state.booksData = data;
                                        this.render();
                                    });
                                } else {
                                    this.showToast("Gagal menghapus: " + res.error, "error");
                                }
                            })
                            .withFailureHandler((err) => {
                                this.showToast("Koneksi gagal: " + err, "error");
                            })
                            .deleteBookFromSheet(id, token);
                    } else {
                        callGAS('deleteBook', { id: id, token: token }).then(res => {
                            if (res && res.success && res.data && res.data.success) {
                                this.showToast("Buku berhasil dihapus!", "success");
                                DB.getBooks().then(data => {
                                    this.state.booksData = data;
                                    this.render();
                                });
                            } else {
                                this.showToast("Gagal menghapus: " + ((res && res.data && res.data.error) ? res.data.error : 'Error'), "error");
                            }
                        }).catch(err => {
                            this.showToast("Koneksi gagal: " + err, "error");
                        });
                    }
                });
            },

            copyShortLink(id) {
                const book = this.state.booksData.find(b => b.id === id);
                if (book) {
                    // Selalu gunakan hash routing SPA jika diluar environment GAS
                    const link = typeof google !== 'undefined' && book.shortLink 
                        ? book.shortLink 
                        : (window.location.origin + window.location.pathname + '#/detail/' + book.id);

                    if (!link) {
                        this.showToast('Gagal menyalin: Link belum tersedia.', 'error');
                        return;
                    }
                    if (navigator.clipboard) {
                        navigator.clipboard.writeText(link).then(() => {
                            this.showToast('Link berhasil disalin!', 'success');
                        }).catch(err => {
                            this.showToast('Gagal menyalin link.', 'error');
                            console.error(err);
                        });
                    } else {
                        // Fallback untuk browser lama
                        const textArea = document.createElement("textarea");
                        textArea.value = link;
                        document.body.appendChild(textArea);
                        textArea.select();
                        try {
                            document.execCommand('copy');
                            this.showToast('Link berhasil disalin!', 'success');
                        } catch (err) {
                            this.showToast('Gagal menyalin link.', 'error');
                        }
                        document.body.removeChild(textArea);
                    }
                }
            },

            submitContactForm(e) {
                e.preventDefault();
                const btn = document.getElementById('btn-submit-contact');
                btn.textContent = 'Mengirim...';
                btn.disabled = true;

                const data = {
                    name: document.getElementById('contact-name').value,
                    email: document.getElementById('contact-email').value,
                    phone: document.getElementById('contact-phone').value,
                    subject: document.getElementById('contact-subject').value,
                    message: document.getElementById('contact-message').value
                };

                DB.sendMessage(data).then(res => {
                    if (res.success) {
                        this.showToast("Pesan berhasil dikirim!");
                        e.target.reset();
                    } else {
                        this.showToast("Gagal mengirim pesan.", "error");
                    }
                    btn.textContent = 'Kirim Pesan';
                    btn.disabled = false;
                });
            },

            showAboutModal() {
                document.getElementById('form-about-tentang').value = this.state.aboutData.tentang || '';
                document.getElementById('form-about-visi').value = this.state.aboutData.visi || '';
                document.getElementById('form-about-misi').value = this.state.aboutData.misi || '';
                document.getElementById('form-about-alamat').value = this.state.aboutData.alamat || '';
                document.getElementById('form-about-email').value = this.state.aboutData.email || '';
                document.getElementById('form-about-telepon').value = this.state.aboutData.telepon || '';
                document.getElementById('about-modal').classList.remove('hidden');
            },

            closeAboutModal() {
                document.getElementById('about-modal').classList.add('hidden');
            },

            saveAbout(e) {
                e.preventDefault();
                const btn = document.getElementById('btn-save-about');
                btn.textContent = 'Menyimpan...';
                btn.disabled = true;

                const data = {
                    tentang: document.getElementById('form-about-tentang').value,
                    visi: document.getElementById('form-about-visi').value,
                    misi: document.getElementById('form-about-misi').value,
                    alamat: document.getElementById('form-about-alamat').value,
                    email: document.getElementById('form-about-email').value,
                    telepon: document.getElementById('form-about-telepon').value
                };

                const token = sessionStorage.getItem('publishinc_admin_token');
                if (typeof google !== 'undefined') {
                    google.script.run
                        .withSuccessHandler((res) => {
                            btn.textContent = 'Simpan Data';
                            btn.disabled = false;
                            if (res.success) {
                                this.state.aboutData = data;
                                this.closeAboutModal();
                                this.showToast("Data profil berhasil disimpan!", "success");
                                if (this.state.view === 'about' || this.state.view === 'contact' || this.state.view === 'home') {
                                    this.render();
                                }
                            } else {
                                this.showToast("Gagal menyimpan: " + res.error, "error");
                            }
                        })
                        .withFailureHandler((err) => {
                            btn.textContent = 'Simpan Data';
                            btn.disabled = false;
                            this.showToast("Koneksi gagal: " + err, "error");
                        })
                        .saveAboutData(data, token);
                } else {
                    callGAS('saveAbout', { aboutData: data, token: token }).then(res => {
                        btn.textContent = 'Simpan Data';
                        btn.disabled = false;
                        if (res && res.success && res.data && res.data.success) {
                            this.state.aboutData = data;
                            this.closeAboutModal();
                            this.showToast("Data profil berhasil disimpan!", "success");
                            if (this.state.view === 'about' || this.state.view === 'contact' || this.state.view === 'home') {
                                this.render();
                            }
                        } else {
                            this.showToast("Gagal menyimpan: " + ((res && res.data && res.data.error) ? res.data.error : 'Error'), "error");
                        }
                    }).catch(err => {
                        btn.textContent = 'Simpan Data';
                        btn.disabled = false;
                        this.showToast("Koneksi gagal: " + err, "error");
                    });
                }
            },

            async render() {
                let html = '';
                switch (this.state.view) {
                    case 'home':
                        html = views.home(this.state.booksData);
                        break;
                    case 'catalog':
                        html = views.catalog(this.state.booksData);
                        break;
                    case 'about':
                        html = views.about(this.state.aboutData);
                        break;
                    case 'contact':
                        html = views.contact(this.state.aboutData);
                        break;
                    case 'detail':
                        const book = this.state.booksData.find(b => b.id === this.state.activeBookId);
                        html = views.detail(book);
                        break;
                    case 'login':
                        html = views.login();
                        break;
                    case 'adminDashboard':
                        html = views.adminDashboard(this.state.booksData);
                        break;
                    case 'adminMessages':
                        await this.loadMessages();
                        html = views.adminMessages(this.state.messages);
                        break;
                    default:
                        html = views.home(this.state.booksData);
                }
                this.rootEl.innerHTML = html;
            }
        };

        document.addEventListener('DOMContentLoaded', () => {
            app.init();
        });

    </script>
</body>

</html>
